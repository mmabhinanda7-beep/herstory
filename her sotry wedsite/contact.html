<!DOCTYPE html>
<html>
<head>
    <title>Contact - Her Story</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            text-align: center;
            background-color: white;
        }

        header {
            background-color: black;
            color: gold;
            padding: 20px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
        }

        .contact-box {
            background-color: #fffaf0;
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background-color: gold;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background-color: black;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Her Story</h1>
        <p>Contact Us</p>
    </header>

    <div class="contact-box">

        <h2>Get in Touch</h2>

        <form>
            <input type="text" placeholder="Your Name"><br>
            <input type="email" placeholder="Your Email"><br>
            <textarea placeholder="Your Message"></textarea><br>

            <button type="submit">Send Message</button>
        </form>

        <p>Email: hello@herstorymagazine.com</p>
        <p>Instagram: @herstorymagazine</p>

        <a href="index.html">Back to Home</a>

    </div>

    <footer>
        © 2026 Her Story Magazine | All Rights Reserved
    </footer>

</body>
</html>
